<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <!-- 3D Gold Star Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="3" />

  <!-- Ambient Glow Behind Star -->
  <circle cx="64" cy="64" r="32" fill="#d97706" opacity="0.4" filter="url(#glow)" />

  <!-- 3D 8-Point Compass Star -->
  <g transform="translate(64, 64)">
    <!-- Primary Cardinal Points (North, South, East, West) -->
    <!-- North Top-Left Light -->
    <polygon points="0,0 0,-48 -14,-14" fill="url(#goldLight)" />
    <!-- North Top-Right Dark -->
    <polygon points="0,0 0,-48 14,-14" fill="url(#goldDark)" />

    <!-- South Bottom-Left Dark -->
    <polygon points="0,0 0,48 -14,14" fill="url(#goldDark)" />
    <!-- South Bottom-Right Light -->
    <polygon points="0,0 0,48 14,14" fill="url(#goldLight)" />

    <!-- East Right-Top Light -->
    <polygon points="0,0 48,0 14,-14" fill="url(#goldLight)" />
    <!-- East Right-Bottom Dark -->
    <polygon points="0,0 48,0 14,14" fill="url(#goldDark)" />

    <!-- West Left-Top Dark -->
    <polygon points="0,0 -48,0 -14,-14" fill="url(#goldDark)" />
    <!-- West Left-Bottom Light -->
    <polygon points="0,0 -48,0 -14,14" fill="url(#goldLight)" />

    <!-- Secondary Diagonal Points (NE, NW, SE, SW) -->
    <!-- North-East Light/Dark -->
    <polygon points="0,0 26,-26 0,-14" fill="url(#goldLight)" opacity="0.9" />
    <polygon points="0,0 26,-26 14,0" fill="url(#goldDark)" opacity="0.9" />

    <!-- North-West Dark/Light -->
    <polygon points="0,0 -26,-26 -14,0" fill="url(#goldDark)" opacity="0.9" />
    <polygon points="0,0 -26,-26 0,-14" fill="url(#goldLight)" opacity="0.9" />

    <!-- South-East Dark/Light -->
    <polygon points="0,0 26,26 14,0" fill="url(#goldDark)" opacity="0.9" />
    <polygon points="0,0 26,26 0,14" fill="url(#goldLight)" opacity="0.9" />

    <!-- South-West Light/Dark -->
    <polygon points="0,0 -26,26 0,14" fill="url(#goldLight)" opacity="0.9" />
    <polygon points="0,0 -26,26 -14,0" fill="url(#goldDark)" opacity="0.9" />

    <!-- Center Diamond Core -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#fffbeb" />
  </g>
</svg>
